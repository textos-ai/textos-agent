name = "textos-agent-dev"
main = "src/index.ts"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Every minute → runHeartbeatWatchdog (existing).
# Every 10 minutes → runGenAppStaleSweep (new). Dispatched in index.ts
#   scheduled() by event.cron.
crons = ["* * * * *", "*/10 * * * *"]

[limits]
# Raised 30000 → 300000 so executionCtx.waitUntil() can complete heavier
# paid-task Anthropic calls. The waitUntil budget is capped by cpu_ms;
# social-content-plan and similar were hitting the 30s cap and getting
# cancelled mid-stream ("waitUntil tasks did not complete within the
# allowed time"). 300000 is the Workers Paid plan maximum. Cloudflare
# bills actual CPU consumed, not the ceiling.
cpu_ms = 300000
subrequests = 1000

[vars]
ENVIRONMENT = "dev"
AUTO_APPROVE_AFTER_USER_COUNT = "100"
DAYCYCLE_PLACES_ENABLED = "false"
FRONTEND_URL = "https://app.victora.ai"

# ----------------------------------------------------------------------
# Bindings below are commented placeholders, wired in subsequent sprints.
# Uncomment + fill IDs as we provision the resources.
# ----------------------------------------------------------------------

# Cloudflare KV — rate limits, magic-link tokens, agent prompt cache.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<kv-namespace-id>"

# KV — anonymous snapshot tokens for C-Lite claim flow (TTL 1hr).
# Run: npx wrangler kv namespace create SNAPSHOT_KV  — then fill in the id below.
[[kv_namespaces]]
binding = "SNAPSHOT_KV"
id = "198fb2847eaa45f9b9d3102311832b9b"

[[kv_namespaces]]
binding = "XAI_SCRIPTS_KV"
id = "b9684fc364194c229a2aedc0be6882c2"
preview_id = "b1800214351949e581d994f728daec0b"

# Cloudflare D1 — per-business activity logs and cache.
# [[d1_databases]]
# binding = "DB"
# database_name = "textos-activity"
# database_id = "<d1-database-id>"

# Cloudflare Queues — long-running task dispatch.
# Generic placeholder kept for reference; specific queue below.

# generate-business-app HTML step queue. Consumer gets a 15-min wall-clock
# budget, fixing the silent-kill problem from CF subrequest body timeouts
# when streaming long Anthropic responses inside the request lifecycle.
# Producer: src/lib/tasks/generate-business-app-design.ts (Design handler).
# Consumer: src/queues/app-gen-html-consumer.ts (dispatched by queue handler
# in src/index.ts).
[[queues.producers]]
binding = "APP_GEN_HTML_QUEUE"
queue = "textos-app-gen-html-prod"

[[queues.consumers]]
queue = "textos-app-gen-html-prod"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# Cloudflare R2 — generated documents, hero images, exports.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "textos-assets"

# Service Binding — Worker calls itself via env.SELF.fetch() for the
# chain-pattern in generate-business-app-design (dispatches the HTML
# step to a separate Worker invocation). Worker→same-Worker fetches
# over the public URL are blocked by Cloudflare (CF error 1042);
# Service Bindings are the supported path. Top-level entry = prod.
[[services]]
binding = "SELF"
service = "textos-agent-dev"

# Production environment — same Worker, separate name + secrets.
# [env.prod]
# name = "textos-agent-prod"
# vars = { ENVIRONMENT = "prod" }

# ────────────────────────────────────────────────────────────────────
# Test environment (textos-agent-test) — added 2026-05-13 for D-4.
# Same code + same data layer as production, test-mode Stripe secrets.
# Cron trigger intentionally omitted — production owns scheduled jobs.
# Deploy:        npx wrangler deploy --env test
# Set secret:    npx wrangler secret put NAME --env test
# List secrets:  npx wrangler secret list --env test
# ────────────────────────────────────────────────────────────────────
[env.test]
name = "textos-agent-test"

# Explicit empty crons — wrangler inherits top-level [triggers] otherwise,
# which would duplicate heartbeat-watchdog scans against shared Supabase.
[env.test.triggers]
crons = []

[env.test.limits]
# Mirror top-level — see comment in [limits].
cpu_ms = 300000
subrequests = 1000

[env.test.vars]
ENVIRONMENT = "test"
AUTO_APPROVE_AFTER_USER_COUNT = "100"
DAYCYCLE_PLACES_ENABLED = "false"
FRONTEND_URL = "https://textos-web-test.pages.dev"

[[env.test.kv_namespaces]]
binding = "SNAPSHOT_KV"
id = "198fb2847eaa45f9b9d3102311832b9b"

[[env.test.r2_buckets]]
binding = "ASSETS"
bucket_name = "textos-assets"

# Service Binding — test variant. Points the SELF binding at this same
# test Worker so the chain pattern's self-fetch works in test the same
# way it works in prod (see top-level [[services]] for the prod binding).
[[env.test.services]]
binding = "SELF"
service = "textos-agent-test"

# Test variant of the HTML-generation queue (separate physical queue from
# prod). Same code path; the producer dispatches whichever binding is in
# scope for this environment.
[[env.test.queues.producers]]
binding = "APP_GEN_HTML_QUEUE"
queue = "textos-app-gen-html-test"

[[env.test.queues.consumers]]
queue = "textos-app-gen-html-test"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
